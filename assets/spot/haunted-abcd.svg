<svg viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#241a3d"/>
      <stop offset="100%" stop-color="#0d0a18"/>
    </linearGradient>
  </defs>

  <!-- sky -->
  <rect x="0" y="0" width="800" height="800" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#ffffff" opacity=".85">
    <circle cx="50" cy="50" r="2.2"/><circle cx="120" cy="90" r="2"/><circle cx="200" cy="40" r="2.4"/>
    <circle cx="300" cy="70" r="2"/><circle cx="380" cy="110" r="2.2"/><circle cx="90" cy="180" r="2"/>
    <circle cx="250" cy="150" r="2.2"/><circle cx="460" cy="50" r="2"/><circle cx="760" cy="150" r="2.4"/>
    <circle cx="600" cy="60" r="2"/><circle cx="30" cy="260" r="2"/><circle cx="730" cy="240" r="2.2"/>
    <circle cx="150" cy="260" r="2"/><circle cx="340" cy="40" r="2"/>
  </g>

  <!-- moon -->
  <circle cx="660" cy="120" r="58" fill="#fdf1c4"/>
  <circle cx="645" cy="100" r="10" fill="#efe0a0" opacity=".55"/>
  <circle cx="680" cy="140" r="7" fill="#efe0a0" opacity=".55"/>
  <circle cx="650" cy="145" r="5" fill="#efe0a0" opacity=".55"/>
  <ellipse cx="610" cy="140" rx="50" ry="14" fill="#241a3d" opacity=".55"/>
  <ellipse cx="700" cy="100" rx="40" ry="12" fill="#241a3d" opacity=".4"/>

  <!-- bats -->
  <g fill="#150f22">
    <g transform="translate(160,150)">
      <path d="M-34 0 Q-18 -16 -2 -2 Q0 -6 0 -6 Q0 -6 2 -2 Q18 -16 34 0 Q18 -4 6 2 Q2 6 0 10 Q-2 6 -6 2 Q-18 -4 -34 0 Z"/>
    </g>
    <g transform="translate(520,90) rotate(10) scale(.8)">
      <path d="M-34 0 Q-18 -16 -2 -2 Q0 -6 0 -6 Q0 -6 2 -2 Q18 -16 34 0 Q18 -4 6 2 Q2 6 0 10 Q-2 6 -6 2 Q-18 -4 -34 0 Z"/>
    </g>
    <g transform="translate(430,190) rotate(-8) scale(.6)">
      <path d="M-34 0 Q-18 -16 -2 -2 Q0 -6 0 -6 Q0 -6 2 -2 Q18 -16 34 0 Q18 -4 6 2 Q2 6 0 10 Q-2 6 -6 2 Q-18 -4 -34 0 Z"/>
    </g>
  </g>

  <!-- spiderweb, top-left -->
  <g opacity=".55" stroke="#cfd6e6" stroke-width="1.5" fill="none">
    <line x1="0" y1="0" x2="95" y2="30"/>
    <line x1="0" y1="0" x2="70" y2="70"/>
    <line x1="0" y1="0" x2="30" y2="95"/>
    <path d="M20 6 Q40 20 26 45"/>
    <path d="M45 12 Q65 35 46 68"/>
    <path d="M70 22 Q85 45 62 88"/>
  </g>

  <!-- bare tree -->
  <g stroke="#150f22" fill="none" stroke-linecap="round">
    <path d="M90 560 L100 460 L96 400" stroke-width="14"/>
    <path d="M100 460 Q60 430 40 390" stroke-width="7"/>
    <path d="M100 460 Q140 420 160 380" stroke-width="7"/>
    <path d="M96 400 Q70 370 55 340" stroke-width="7"/>
    <path d="M96 400 Q120 365 140 330" stroke-width="7"/>
  </g>

  <!-- friendly ghost, decorative -->
  <g transform="translate(150,330)">
    <path d="M-40 10 Q-40 -40 0 -40 Q40 -40 40 10 L40 40 Q30 30 22 40 Q14 30 6 40 Q-2 30 -10 40 Q-18 30 -26 40 Q-34 30 -40 40 Z"
          fill="#eef2ff" opacity=".92" stroke="#c7d3ea" stroke-width="2"/>
    <circle cx="-14" cy="0" r="5" fill="#2b3550"/>
    <circle cx="14" cy="0" r="5" fill="#2b3550"/>
    <path d="M-6 16 Q0 22 6 16" stroke="#2b3550" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- ground -->
  <path d="M0 560 Q120 520 260 548 Q400 576 540 540 Q660 512 800 550 L800 800 L0 800 Z"
        fill="#140f21" stroke="#22182f" stroke-width="5"/>
  <path d="M0 650 Q200 620 400 645 Q600 670 800 640 L800 800 L0 800 Z" fill="#0d0a17"/>

  <!-- stepping-stone path to the door -->
  <g fill="#7d7a8a" stroke="#5c5968" stroke-width="2" opacity=".95">
    <ellipse cx="500" cy="780" rx="36" ry="14"/>
    <ellipse cx="515" cy="730" rx="32" ry="13"/>
    <ellipse cx="525" cy="685" rx="30" ry="12"/>
    <ellipse cx="530" cy="635" rx="28" ry="11"/>
    <ellipse cx="532" cy="590" rx="26" ry="10"/>
  </g>

  <!-- haunted house -->
  <path d="M615 300 L660 210 L705 300 Z" fill="#1a1226" stroke="#150f22" stroke-width="4"/>
  <rect x="625" y="300" width="70" height="190" fill="#3b2a4a" stroke="#241a30" stroke-width="4"/>
  <line x1="660" y1="210" x2="660" y2="180" stroke="#150f22" stroke-width="3"/>
  <path d="M660 180 L686 190 L660 200 Z" fill="#b23a3a"/>
  <rect x="645" y="340" width="30" height="40" rx="4" fill="#ffe58a" stroke="#241a30" stroke-width="3"/>

  <path d="M400 390 L540 250 L680 390 Z" fill="#241a30" stroke="#150f22" stroke-width="4"/>
  <rect x="430" y="390" width="220" height="170" rx="4" fill="#3b2a4a" stroke="#241a30" stroke-width="4"/>

  <circle cx="540" cy="330" r="20" fill="#ffe58a" stroke="#241a30" stroke-width="3"/>
  <line x1="540" y1="310" x2="540" y2="350" stroke="#241a30" stroke-width="2"/>
  <line x1="520" y1="330" x2="560" y2="330" stroke="#241a30" stroke-width="2"/>

  <rect x="452" y="430" width="46" height="56" rx="4" fill="#ffe58a" stroke="#241a30" stroke-width="3"/>
  <line x1="475" y1="430" x2="475" y2="486" stroke="#241a30" stroke-width="2"/>
  <line x1="452" y1="458" x2="498" y2="458" stroke="#241a30" stroke-width="2"/>
  <rect x="562" y="430" width="46" height="56" rx="4" fill="#ffe58a" stroke="#241a30" stroke-width="3"/>
  <line x1="585" y1="430" x2="585" y2="486" stroke="#241a30" stroke-width="2"/>
  <line x1="562" y1="458" x2="608" y2="458" stroke="#241a30" stroke-width="2"/>

  <!-- door, with a hidden D -->
  <path d="M505 550 L505 500 Q505 480 525 480 L555 480 Q575 480 575 500 L575 550 Z"
        fill="#180f22" stroke="#241a30" stroke-width="3"/>
  <text x="540" y="518" font-family="'Arial Black', Arial, Helvetica, sans-serif" font-weight="900"
        font-size="52" fill="#d8c8a0" text-anchor="middle" dominant-baseline="central">D</text>
  <circle cx="568" cy="545" r="4" fill="#d8c8a0"/>

  <!-- tombstone, with a hidden A -->
  <path d="M60 600 L60 530 Q60 495 105 495 Q150 495 150 530 L150 600 Z"
        fill="#8a8f98" stroke="#5b616b" stroke-width="4"/>
  <text x="105" y="557" font-family="'Arial Black', Arial, Helvetica, sans-serif" font-weight="900"
        font-size="48" fill="#4a4e58" text-anchor="middle" dominant-baseline="central">A</text>

  <!-- blank decoy tombstone -->
  <path d="M690 640 L690 590 Q690 565 720 565 Q750 565 750 590 L750 640 Z"
        fill="#787d86" stroke="#53575f" stroke-width="3"/>

  <!-- spellbook, with a hidden B -->
  <path d="M310 690 L310 740 Q310 750 320 750 L390 750 Q400 750 400 740 L400 690 Q400 680 390 680 L320 680 Q310 680 310 690 Z"
        fill="#5b3a8a" stroke="#3a2560" stroke-width="3"/>
  <line x1="355" y1="680" x2="355" y2="750" stroke="#3a2560" stroke-width="2"/>
  <text x="355" y="717" font-family="'Arial Black', Arial, Helvetica, sans-serif" font-weight="900"
        font-size="42" fill="#e8dcff" text-anchor="middle" dominant-baseline="central">B</text>

  <!-- jack-o-lantern, with a hidden C -->
  <ellipse cx="630" cy="735" rx="58" ry="48" fill="#ff8a3d" stroke="#c9601f" stroke-width="4"/>
  <path d="M600 692 Q592 735 600 778" stroke="#c9601f" stroke-width="3" fill="none"/>
  <path d="M630 688 Q625 735 630 782" stroke="#c9601f" stroke-width="3" fill="none"/>
  <path d="M660 692 Q668 735 660 778" stroke="#c9601f" stroke-width="3" fill="none"/>
  <rect x="620" y="678" width="20" height="26" rx="6" fill="#5a8a3d" stroke="#3f6b28" stroke-width="2"/>
  <text x="630" y="740" font-family="'Arial Black', Arial, Helvetica, sans-serif" font-weight="900"
        font-size="48" fill="#7a3b12" text-anchor="middle" dominant-baseline="central">C</text>

  <!-- blank decoy pumpkin, with its own jack-o-lantern face -->
  <ellipse cx="470" cy="760" rx="38" ry="32" fill="#ff8a3d" stroke="#c9601f" stroke-width="3"/>
  <rect x="463" y="730" width="14" height="18" rx="5" fill="#5a8a3d"/>
  <polygon points="458,752 468,752 463,762" fill="#3a2015"/>
  <polygon points="472,752 482,752 477,762" fill="#3a2015"/>
  <path d="M455 770 L462 778 L470 770 L478 778 L486 770" stroke="#3a2015" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- fence -->
  <g fill="#0a0812">
    <rect x="0" y="770" width="800" height="6"/>
  </g>
</svg>
